<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF4E9">

  <!-- ========== SEO Meta Tags (توسط سرور از تنظیمات پنل پر می‌شود) ========== -->
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <meta name="keywords" content="{{SEO_KEYWORDS}}">
  <meta name="author" content="{{SITE_NAME}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <!-- ========== Open Graph ========== -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{SEO_TITLE}}">
  <meta property="og:description" content="{{SEO_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{SITE_NAME}}">

  <!-- ========== Twitter Card ========== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{SEO_TITLE}}">
  <meta name="twitter:description" content="{{SEO_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <!-- ========== Additional SEO ========== -->
  <meta name="geo.region" content="IR-30">
  <meta name="geo.placename" content="تهران">
  <meta name="geo.position" content="35.6892;51.3890">
  <meta name="ICBM" content="35.6892, 51.3890">
  <meta http-equiv="Content-Language" content="fa">
  <meta name="format-detection" content="telephone=yes">

  <!-- ========== Favicon ========== -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='5' cy='10' r='2'/><circle cx='9' cy='5.5' r='2'/><circle cx='15' cy='5.5' r='2'/><circle cx='19' cy='10' r='2'/><path d='M12 12c-3 0-5.5 2-5.5 4.5a2.5 2.5 0 0 0 5 .5 2.5 2.5 0 0 0 5-.5C17.5 14 15 12 12 12z'/></svg>">
  <link rel="apple-touch-icon" href="/assets/img/icon-192.webp">

  <!-- ========== Structured Data (Organization) ========== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{SITE_NAME}}",
    "url": "{{CANONICAL_URL}}",
    "logo": "{{OG_IMAGE}}",
    "description": "{{SEO_DESCRIPTION}}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "تهران",
      "addressRegion": "تهران",
      "addressCountry": "IR",
      "streetAddress": "خیابان ولیعصر، بالاتر از پارک‌وی، پلاک ۱۲۳"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+98-21-22334455",
      "contactType": "customer service",
      "availableLanguage": "Persian"
    },
    "sameAs": [
      "https://instagram.com/petshop.ir",
      "https://t.me/petshop_ir"
    ]
  }
  </script>

  <!-- ========== Structured Data (WebSite + SearchAction) ========== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{SITE_NAME}}",
    "url": "{{CANONICAL_URL}}",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{CANONICAL_URL}}#/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ========== Structured Data (BreadcrumbList) ========== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "خانه", "item": "https://petshop.ir/" },
      { "@type": "ListItem", "position": 2, "name": "فروشگاه", "item": "https://petshop.ir/#/shop" },
      { "@type": "ListItem", "position": 3, "name": "بلاگ", "item": "https://petshop.ir/#/blog" }
    ]
  }
  </script>

  <!-- ========== Preconnect ========== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://www.googletagmanager.com">

  <!-- ========== Fonts ========== -->
  <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ========== Stylesheets ========== -->
  <link rel="stylesheet" href="/css/store.css?v=6">
  <link rel="stylesheet" href="/css/store-desktop.css?v=6">
  <link rel="stylesheet" href="/css/store-mobile.css?v=6">

  <!-- ========== Google Analytics (توسط سرور تزریق می‌شود) ========== -->
  {{GA_SNIPPET}}
</head>
<body>
  <div id="app">
    <header id="site-header" aria-label="سربرگ"></header>
    <main id="view" tabindex="-1"></main>
    <footer id="site-footer"></footer>
    <nav id="bottom-nav" class="bottom-nav" aria-label="ناوبری موبایل"></nav>

    <div id="search-overlay" class="search-overlay" hidden></div>
    <div id="cart-drawer" class="cart-drawer" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="skeleton-root"></div>
  </div>
  <noscript>برای استفاده از پت‌شاپ، جاوااسکریپت را فعال کنید.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
