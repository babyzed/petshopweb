# ============================================================
# پت‌شاپ — Docker Compose
# اجرا: docker compose up -d --build
# توقف: docker compose down
# ============================================================
services:
  web:
    build: .
    container_name: petshop
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - TZ=Asia/Tehran
    volumes:
      # دیتابیس SQLite — با حذف کانتینر از بین نمی‌رود
      - ./data:/app/data
      # تصاویر آپلودشده از پنل مدیریت
      - ./uploads:/app/uploads
    restart: unless-stopped
    # محدودیت منابع (برای سرورهای کوچک)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
